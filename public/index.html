const solid=[...blocks,...poi.filter(p=>p.name!=='MOL BUBI')];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr}addEventListener('resize',resize);resize();
function roundrect(x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}

function building(b,color){rect(b.x+10,b.y+12,b.w,b.h,'#1b2d2c88');c.fillStyle=color;roundrect(b.x,b.y,b.w,b.h,5);c.fill();c.strokeStyle='#35413f';c.lineWidth=5;c.stroke();c.strokeStyle='#e2d2b080';c.lineWidth=2;c.strokeRect(b.x+14,b.y+14,b.w-28,b.h-28);for(let j=20;j<b.w-20;j+=29){rect(b.x+j,b.y+3,15,8,'#334e4e');rect(b.x+j,b.y+b.h-11,15,8,'#334e4e')}}
function map(){rect(0,0,MW,MH,'#526c58');for(let i=0;i<130;i++){let x=(i*193+67)%MW,y=(i*337+89)%MH;if(roads.some(r=>x>r.x-35&&x<r.x+r.w+35&&y>r.y-35&&y<r.y+r.h+35)||solid.some(b=>x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h))continue;c.fillStyle='#32664c';c.beginPath();c.arc(x,y,13,0,Math.PI*2);c.fill();c.fillStyle='#62956a';c.beginPath();c.arc(x-3,y-4,6,0,Math.PI*2);c.fill()}
roads.forEach(r=>{rect(r.x-25,r.y-25,r.w+50,r.h+50,'#adaf9d');rect(r.x,r.y,r.w,r.h,'#343f42')});c.strokeStyle='#cbbf8b';c.lineWidth=3;c.setLineDash([19,26]);c.beginPath();c.moveTo(615,0);c.lineTo(615,MH);c.stroke();c.setLineDash([]);c.strokeStyle='#9db0b2';c.lineWidth=3;for(const x of [540,553]){c.beginPath();c.moveTo(x,0);c.lineTo(x,MH);c.stroke()}for(let y=10;y<MH;y+=21)rect(538,y,17,2,'#c1b494');for(let y of [195,625,1100,1870,2340])for(let x=485;x<745;x+=38)rect(x,y+32,18,49,'#dfe2d1');
for(let b of blocks){building(b,'#a39c88');rect(b.x+55,b.y+58,b.w-110,Math.max(25,b.h-116),'#526c58')}
for(let p of poi){building(p,p.color);label(p.symbol+' '+p.name,p.x+p.w/2,p.y+p.h*.44,p.name.length>12?14:20);label(p.info,p.x+p.w/2,p.y+p.h*.7,12);rect(p.x-8,p.y+p.h*.48,14,34,'#f2e4a3')}
label('ANGYAL UTCA',615,257,16);label('LILIOM UTCA',615,684,16);label('BOKRÉTA UTCA',615,1160,16);label('MESTER UTCA',607,875,25,'#f0e2c4',-Math.PI/2);label('MESTER UTCA',607,2100,25,'#f0e2c4',-Math.PI/2);label('↑ BORÁROS TÉR',620,81,17);label('↓ HALLER UTCA',620,2540,17);rect(511,1575,46,104,'#c2dba7');label('TRAM',535,1560,12)}
function drawCar(v){c.save();c.translate(v.x,v.y);c.rotate(v.a);c.fillStyle='#1a2329';c.fillRect(-32,-28,7,18);c.fillRect(25,-28,7,18);c.fillRect(-32,19,7,18);c.fillRect(25,19,7,18);c.fillStyle='#bb5547';roundrect(-26,-46,52,92,12);c.fill();c.fillStyle='#263c45';roundrect(-20,-22,40,38,5);c.fill();rect(-20,-43,9,6,'#fff6bd');rect(11,-43,9,6,'#fff6bd');c.restore()}
function drawBike(v){c.save();c.translate(v.x,v.y);c.rotate(v.a);c.strokeStyle='#14282a';c.lineWidth=4;for(let y of [-20,20]){c.beginPath();c.arc(0,y,12,0,Math.PI*2);c.stroke()}c.strokeStyle='#55d987';c.lineWidth=5;c.beginPath();c.moveTo(0,-20);c.lineTo(-10,0);c.lineTo(0,20);c.lineTo(11,0);c.lineTo(0,-20);c.stroke();c.restore()}
function person(){if(mode!=='foot')return;c.save();c.translate(pos.x,pos.y);c.rotate(face*.17);c.fillStyle='#1a262e';c.fillRect(-10,4,9,17);c.fillRect(3,4,9,17);c.fillStyle='#386a7c';roundrect(-16,-19,32,28,8);c.fill();c.fillStyle='#e8b28c';c.beginPath();c.arc(0,-24,13,0,Math.PI*2);c.fill();c.fillStyle='#3b2b28';c.beginPath();c.ellipse(0,-33,13,6,0,0,Math.PI*2);c.fill();rect(-5,-27,3,3,'#152d33');rect(4,-27,3,3,'#152d33');c.restore()}
function blocked(x,y,r){return x<20||y<20||x>MW-20||y>MH-20||solid.some(b=>x+r>b.x+6&&x-r<b.x+b.w-6&&y+r>b.y+6&&y-r<b.y+b.h-6)}
function msg(s){toastbox.textContent=s;toastbox.style.opacity='1';toastUntil=performance.now()+3400}
function interact(){if(mode!=='foot'){const v=active;mode='foot';active=null;pos.x=clamp(v.x+43,30,MW-30);pos.y=clamp(v.y+36,30,MH-30);status.textContent='🚶 ON FOOT';msg('You got out. The adventure continues.');return}if(Math.hypot(pos.x-car.x,pos.y-car.y)<110){mode='car';active=car;status.textContent='🚗 DRIVING';msg('Car entered! Hold W to accelerate, S to reverse, A/D to steer. E to exit.');return}if(Math.hypot(pos.x-bike.x,pos.y-bike.y)<115){mode='bike';active=bike;status.textContent='🚲 BUBI';msg('Bubi bicycle acquired. E to return it.');return}const p=poi.find(p=>Math.hypot(pos.x-(p.x+p.w/2),pos.y-(p.y+p.h/2))<210);msg(p?p.name+' · Shop interiors coming in the next version.':'Nothing nearby. Find the car, Bubi station or a shop.')}
addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyE'&&!e.repeat)interact();if(e.code==='Equal')zoom=clamp(zoom+.1,.6,1.8);if(e.code==='Minus')zoom=clamp(zoom-.1,.6,1.8)});addEventListener('keyup',e=>keys[e.code]=false);
const pad=document.getElementById('pad'),knob=document.getElementById('knob');let pointer=null;function stick(e){const b=pad.getBoundingClientRect(),x=e.clientX-(b.left+b.width/2),y=e.clientY-(b.top+b.height/2),len=Math.max(1,Math.hypot(x,y)),dist=Math.min(35,len);touch.x=x/Math.max(35,len);touch.y=y/Math.max(35,len);knob.style.transform='translate('+(x/len*dist)+'px,'+(y/len*dist)+'px)'}
pad.addEventListener('pointerdown',e=>{pointer=e.pointerId;pad.setPointerCapture(pointer);stick(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===pointer)stick(e)});function reset(){pointer=null;touch.x=touch.y=0;knob.style.transform=''}pad.addEventListener('pointerup',reset);pad.addEventListener('pointercancel',reset);document.getElementById('act').addEventListener('pointerdown',e=>{e.preventDefault();interact()});
let prev=performance.now();function tick(t){const dt=Math.min(.045,(t-prev)/1000);prev=t;clock+=dt;const dx=(+!!(keys.KeyD||keys.ArrowRight)-+!!(keys.KeyA||keys.ArrowLeft))+touch.x,dy=(+!!(keys.KeyS||keys.ArrowDown)-+!!(keys.KeyW||keys.ArrowUp))+touch.y,len=Math.hypot(dx,dy),ux=dx/Math.max(1,len),uy=dy/Math.max(1,len);
if(active){const v=active,accel=mode==='car'?390:245,max=mode==='car'?390:205;if(uy<-.15)v.v+=accel*dt;else if(uy>.15)v.v-=accel*.75*dt;else v.v*=Math.max(0,1-2.5*dt);v.v=clamp(v.v,-max*.4,max);if(Math.abs(v.v)>5)v.a+=ux*dt*(mode==='car'?1.9:2.7)*Math.sign(v.v);let x=v.x+Math.sin(v.a)*v.v*dt,y=v.y-Math.cos(v.a)*v.v*dt;if(!blocked(x,y,mode==='car'?20:15)){v.x=x;v.y=y}else v.v=0;pos.x=v.x;pos.y=v.y}
else if(len>.06){let sp=keys.ShiftLeft||keys.ShiftRight?270:185,x=pos.x+ux*sp*dt,y=pos.y+uy*sp*dt;if(!blocked(x,pos.y,12))pos.x=x;if(!blocked(pos.x,y,12))pos.y=y;face=Math.atan2(ux,-uy)}
const p=poi.find(p=>Math.hypot(pos.x-(p.x+p.w/2),pos.y-(p.y+p.h/2))<210);near.textContent=mode==='foot'?(p?p.name+' · Press E to interact':'WASD move · E to enter a vehicle'):('W accelerate · S reverse · A/D steer · E exit');
c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);const zz=zoom*Math.max(.48,Math.min(1.08,Math.min(W/1000,H/720)));c.translate(W/2,H/2);c.scale(zz,zz);c.translate(-pos.x,-pos.y);map();drawCar(car);drawBike(bike);person();if(mode==='foot'){for(const v of [car,bike])if(Math.hypot(pos.x-v.x,pos.y-v.y)<150)label(v===car?'E · DRIVE':'E · BUBI',v.x,v.y-67,14,'#ddffbe')}if(t>toastUntil)toastbox.style.opacity='0';requestAnimationFrame(tick)}
requestAnimationFrame(tick);msg('v0.1.3 · Red car spawns in the CENTER of Mester utca, right beside you.');
</script></body></html>
