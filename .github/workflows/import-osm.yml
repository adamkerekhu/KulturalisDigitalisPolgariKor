name: Import OpenStreetMap snapshot (manual refresh)
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/import-osm.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download geographic data
        run: node scripts/fetch-osm.mjs
      - name: Verify and commit snapshot
        run: |
          node --input-type=module -e "import fs from 'node:fs';const x=JSON.parse(fs.readFileSync('public/osm-map.json'));if(x.elements.length<100)process.exit(1);console.log('Map contains',x.elements.length,'features')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/osm-map.json
          if git diff --cached --quiet; then
            echo "Map already up-to-date."
          else
            git commit -m "data: save verified OpenStreetMap Mester utca snapshot"
            git push origin HEAD:develop
          fi
